plugins {
    id 'java'
    id 'application'
}

group = 'in.simplifymoney'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // H2 SQL ledger
    runtimeOnly 'com.h2database:h2:2.2.224'

    // MongoDB document store
    implementation 'org.mongodb:mongodb-driver-sync:5.6.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'in.simplifymoney.ledgersync.App'
}

test {
    useJUnitPlatform()
}

// Dependency-free smoke run
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    mainClass = 'in.simplifymoney.ledgersync.SelfCheck'
    classpath = sourceSets.main.runtimeClasspath
}